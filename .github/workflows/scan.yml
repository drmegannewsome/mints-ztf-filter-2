name: ZTF scan

on:
  schedule:
    - cron: "0 13 * * *"        # 13:00 UTC daily (~08:00 Austin)
  workflow_dispatch:
    inputs:
      days:
        description: "Discovery window in days (--days)"
        type: choice
        options: ["14", "30", "45", "60", "90"]
        default: "60"
      min_ndet:
        description: "Minimum detections (--min-ndet)"
        type: choice
        options: ["4", "5", "8", "12", "20"]
        default: "4"
      sigma_max:
        description: "Nuclear tolerance in sigma (--sigma-max) — does NOT affect runtime"
        type: choice
        options: ["0.5", "1.0", "1.5", "2.0", "3.0"]
        default: "1.0"
      rising:
        description: "Require rising (--rising)"
        type: boolean
        default: false
      max_objects:
        description: "Cap objects screened — leave blank for no cap (smoke tests only)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ztf-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          # The `||` fallbacks supply the scheduled-run values, since `inputs`
          # is empty on a cron trigger. Keep them in step with the dispatch
          # defaults above.
          DAYS:        ${{ inputs.days        || '60'  }}
          MIN_NDET:    ${{ inputs.min_ndet    || '4'   }}
          SIGMA_MAX:   ${{ inputs.sigma_max   || '1.0' }}   # runtime-neutral; raise to keep more rows
          RISING:      ${{ inputs.rising      || 'false' }}
          MAX_OBJECTS: ${{ inputs.max_objects || ''    }}
        run: |
          set -euo pipefail
          ARGS=(--days "$DAYS"
                --min-ndet "$MIN_NDET"
                --sigma-max "$SIGMA_MAX"
                --workers 8
                --rate 5
                --out docs/candidates.csv)
          if [ "$RISING" = "true" ]; then ARGS+=(--rising); fi
          if [ -n "$MAX_OBJECTS" ]; then ARGS+=(--max-objects "$MAX_OBJECTS"); fi
          echo "+ python -u ztf_filter_6000.py ${ARGS[*]}"
          python -u ztf_filter_6000.py "${ARGS[@]}"

      - name: Stamp the run
        run: |
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "days=${{ inputs.days || '60' }} min_ndet=${{ inputs.min_ndet || '4' }} sigma_max=${{ inputs.sigma_max || '1.0' }} rising=${{ inputs.rising || 'false' }}"
          } > docs/last_run.txt

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/candidates.csv docs/last_run.txt
          git diff --staged --quiet || git commit -m "Automated ZTF scan $(date -u +%F)"
          git push
