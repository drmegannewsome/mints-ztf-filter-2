name: ZTF scan

on:
  schedule:
    - cron: "23 13 * * *"       # 13:23 UTC daily (~08:23 Austin); off the congested top of the hour
  workflow_dispatch:
    inputs:
      days:
        description: "Discovery window in days (--days)"
        type: choice
        options: ["14", "30", "45", "60", "90"]
        default: "90"
      min_ndet:
        description: "Minimum detections (--min-ndet)"
        type: choice
        options: ["4", "5", "8", "12", "20"]
        default: "4"
      sigma_max:
        description: "Nuclear tolerance in sigma (--sigma-max); 2.4477 = iinuclear's p > 0.05. Does NOT affect runtime; sigmas are cached, so changing it never re-runs iinuclear"
        type: choice
        options: ["0.5", "1.0", "1.5", "2.0", "2.4477", "3.0"]
        default: "2.4477"
      rising:
        description: "Require rising (--rising)"
        type: boolean
        default: false
      max_objects:
        description: "Cap objects screened — leave blank for no cap (smoke tests only)"
        type: string
        default: ""
      recheck_stars:
        description: "Re-check stars on ALL current candidates, one by one against Gaia (--recheck-stars). Off for normal runs"
        type: boolean
        default: false
      reset_state:
        description: "Discard state/scan_state.json and rebuild it (--reset-state): a cold start, needed once after changing the epoch rules"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ztf-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # `ref` = the branch TIP when this job actually starts. Without it a run that waited in
      # the queue (behind another scan) checks out the commit that existed when it was
      # QUEUED -- missing the other run's results, redoing its work and then conflicting on push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # A daily run that GitHub starts late, right after a manual scan, is skipped.
      - name: Skip a scheduled run that follows a recent scan
        id: guard
        if: github.event_name == 'schedule'
        run: |
          skip=false
          if [ -f docs/last_run.txt ]; then
            last=$(head -n1 docs/last_run.txt)
            then_s=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            age=$(( $(date -u +%s) - then_s ))
            echo "last scan stamp: $last (${age}s ago)"
            if [ "$age" -lt 36000 ]; then skip=true; echo "-> a scan finished less than 10 h ago; skipping this scheduled run"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ---- Stage 6 support: DESI catalog for the archival-spectra check -------
      # Deliberately soft-fail: if any of these three steps breaks, the scan
      # still runs and simply leaves the spec_* columns blank (spec_checked=False).
      - name: Install fitsio (archival-spectra check)
        continue-on-error: true
        run: pip install -r requirements-spectra.txt

      - name: Restore DESI catalog cache
        id: desi-cache
        uses: actions/cache@v4
        with:
          path: spectra_finding/data/agngal_desi.fits
          key: desi-dr1-agngal-v1.0

      - name: Download DESI DR1 AGN/Galaxy VAC (first run / cache miss only)
        if: steps.desi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p spectra_finding/data
          curl -fL --retry 5 --retry-delay 15 \
               -o spectra_finding/data/agngal_desi.fits.part \
               https://data.desi.lbl.gov/public/dr1/vac/dr1/agngal/v1.0/agngal_desi.fits
          mv spectra_finding/data/agngal_desi.fits.part spectra_finding/data/agngal_desi.fits
          ls -l spectra_finding/data/

      - name: Run scan
        id: scan
        if: steps.guard.outputs.skip != 'true'
        env:
          # The `||` fallbacks supply the scheduled-run values, since `inputs`
          # is empty on a cron trigger. Keep them in step with the dispatch
          # defaults above.
          DAYS:        ${{ inputs.days        || '90'  }}
          MIN_NDET:    ${{ inputs.min_ndet    || '4'   }}
          SIGMA_MAX:   ${{ inputs.sigma_max   || '2.4477' }}   # runtime-neutral; = iinuclear's p > 0.05
          RISING:      ${{ inputs.rising      || 'false' }}
          MAX_OBJECTS: ${{ inputs.max_objects || ''    }}
          RECHECK_STARS: ${{ inputs.recheck_stars || 'false' }}
          RESET_STATE:   ${{ inputs.reset_state   || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(--days "$DAYS"
                --min-ndet "$MIN_NDET"
                --sigma-max "$SIGMA_MAX"
                --workers 8
                --rate 5
                --max-minutes 200
                --state state/scan_state.json
                --spec-vac spectra_finding/data/agngal_desi.fits
                --out docs/candidates.csv)
          if [ "$RISING" = "true" ]; then ARGS+=(--rising); fi
          if [ -n "$MAX_OBJECTS" ]; then ARGS+=(--max-objects "$MAX_OBJECTS"); fi
          if [ "$RECHECK_STARS" = "true" ]; then ARGS+=(--recheck-stars); fi
          if [ "$RESET_STATE" = "true" ]; then ARGS+=(--reset-state); fi
          echo "+ python -u ztf_filter_6000.py ${ARGS[*]}"
          python -u ztf_filter_6000.py "${ARGS[@]}"

      # `!cancelled()` rather than the default success(): if the scan stops early
      # (time budget, nothing finished) its per-object progress in state/ is still banked.
      - name: Stamp the run
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "days=${{ inputs.days || '90' }} min_ndet=${{ inputs.min_ndet || '4' }} sigma_max=${{ inputs.sigma_max || '2.4477' }} rising=${{ inputs.rising || 'false' }} recheck_stars=${{ inputs.recheck_stars || 'false' }} reset_state=${{ inputs.reset_state || 'false' }}"
            echo "scan step: ${{ steps.scan.outcome }}"
            if [ -f scan_partial.txt ]; then cat scan_partial.txt; fi
          } > docs/last_run.txt

      # Keep the results even if the push below fails (they cost hours to produce).
      - name: Save results as a workflow artifact
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            docs/candidates.csv
            docs/last_run.txt
            state/scan_state.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit results
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/candidates.csv docs/last_run.txt
          if [ -f state/scan_state.json ]; then git add state/scan_state.json; fi
          git diff --staged --quiet || git commit -m "Automated ZTF scan $(date -u +%F)"
          # These files are regenerated in full each run, so if someone else pushed meanwhile,
          # this run's version wins any conflict ("theirs" = the commit being replayed).
          git pull --rebase -X theirs
          git push
